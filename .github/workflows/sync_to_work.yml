name: Sync to Work GitHub

on:
  push:
    branches:
      - '*'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Push to Work Repository
        env:
          WORK_PAT: ${{ secrets.WORK_GITHUB_TOKEN }}
        run: |
          if [ -z "$WORK_PAT" ]; then
            echo "::error::WORK_GITHUB_TOKEN not found. Please add this secret in the home repository under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          # Clear the default auth header to avoid conflicts with the company account credentials (the key fix for exit code 128)
          git config --unset-all http.https://github.com/.extraheader || true

          git config --global user.name "Auto Sync Bot"
          git config --global user.email "bot@github.com"

          # Push the current branch and all tags to the company repository
          git push https://lijunstesterspace:${WORK_PAT}@github.com/lijunstesterspace/slotgame-testing-harness.git HEAD:refs/heads/${{ github.ref_name }} --force --tags
