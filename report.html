<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Verification Report - P5P_Bonus_Mini.testdata</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #6366f1;
            --success: #10b981;
            --failure: #ef4444;
            --border: #334155;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 2rem 1rem;
            line-height: 1.5;
        }
        .report-container {
            max-width: 1000px;
            margin: 0 auto;
        }
        header {
            margin-bottom: 2rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 1.5rem;
        }
        h1 { font-size: 2rem; margin-bottom: 0.5rem; }
        .meta { color: var(--text-muted); font-size: 0.9rem; display: flex; gap: 1.5rem; }
        
        /* Summary Dashboard */
        .summary-dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2.5rem;
        }
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
            text-align: center;
        }
        .card-value { font-size: 2rem; font-weight: 700; margin-top: 0.5rem; }
        .status-badge {
            display: inline-block;
            font-weight: 800;
            padding: 0.5rem 1.5rem;
            border-radius: 20px;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-top: 0.5rem;
        }
        
        /* Test Results Table */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1.5rem;
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
        }
        th, td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }
        th { background-color: rgba(255,255,255,0.03); font-weight: 600; color: var(--text-muted); }
        
        .badge {
            display: inline-block;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 0.25rem 0.6rem;
            border-radius: 6px;
            text-transform: uppercase;
        }
        .badge-pass { background-color: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
        .badge-fail { background-color: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }
        
        /* Screenshot Styles */
        .screenshot-thumbnail {
            width: 100px;
            height: 60px;
            object-fit: cover;
            border-radius: 6px;
            border: 1px solid var(--border);
            cursor: pointer;
            transition: transform 0.2s;
        }
        .screenshot-thumbnail:hover {
            transform: scale(1.1);
        }
        
        /* Modal for Enlarging Images */
        .modal {
            display: none;
            position: fixed;
            z-index: 999;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.85);
            align-items: center;
            justify-content: center;
        }
        .modal-content {
            max-width: 90%;
            max-height: 90%;
            border-radius: 8px;
            border: 2px solid var(--border);
        }
    </style>
</head>
<body>
    <div class="report-container">
        <header>
            <h1>Test Verification Report</h1>
            <div class="meta">
                <span><strong>File:</strong> P5P_Bonus_Mini.testdata</span>
                <span><strong>Module ID:</strong> 10539</span>
                <span><strong>Date:</strong> 2026-08-06 16:14:09</span>
            </div>
        </header>

        <div class="summary-dashboard">
            <div class="card">
                <div style="color: var(--text-muted);">Overall Status</div>
                <div class="status-badge" style="background-color: #10B981;">PASS</div>
            </div>
            <div class="card">
                <div style="color: var(--text-muted);">Total Spins</div>
                <div class="card-value">2</div>
            </div>
            <div class="card">
                <div style="color: var(--text-muted); color: #34d399;">Passed</div>
                <div class="card-value" style="color: #34d399;">2</div>
            </div>
            <div class="card">
                <div style="color: var(--text-muted); color: #f87171;">Failed</div>
                <div class="card-value" style="color: #f87171;">0</div>
            </div>
        </div>

        <h2>Spin Validation Details</h2>
        <table>
            <thead>
                <tr>
                    <th>Spin #</th>
                    <th>Expected (Batch, Index)</th>
                    <th>Actual (Batch, Index)</th>
                    <th>Status</th>
                    <th>Screenshot</th>
                </tr>
            </thead>
            <tbody>

                <tr>
                    <td><strong>1</strong></td>
                    <td><code>(58, 3)</code></td>
                    <td><code>(58, 3)</code></td>
                    <td><span class="badge badge-pass">PASS</span></td>
                    <td>
                        <img src="screenshots/spin_1_actual_58_3.png" class="screenshot-thumbnail" onclick="openModal(this.src)" alt="Screenshot">
                    </td>
                </tr>

                <tr>
                    <td><strong>2</strong></td>
                    <td><code>(2, 67933)</code></td>
                    <td><code>(2, 67933)</code></td>
                    <td><span class="badge badge-pass">PASS</span></td>
                    <td>
                        <img src="screenshots/spin_2_actual_2_67933.png" class="screenshot-thumbnail" onclick="openModal(this.src)" alt="Screenshot">
                    </td>
                </tr>

            </tbody>
        </table>
    </div>

    <!-- Modal for enlarging screenshots -->
    <div id="imgModal" class="modal" onclick="this.style.display='none'">
        <img class="modal-content" id="modalImg">
    </div>

    <script>
        function openModal(src) {
            document.getElementById('modalImg').src = src;
            document.getElementById('imgModal').style.display = 'flex';
        }
    </script>
</body>
</html>
